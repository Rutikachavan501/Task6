<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Student Management System</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        padding: 20px;
      }
      h2 {
        text-align: center;
      }
      form {
        background: #fff;
        padding: 15px;
        max-width: 400px;
        margin: auto;
        border-radius: 5px;
      }
      input,
      button {
        width: 100%;
        padding: 8px;
        margin: 6px 0;
      }
      table {
        width: 100%;
        margin-top: 20px;
        border-collapse: collapse;
        background: #fff;
      }
      table,
      th,
      td {
        border: 1px solid #ccc;
      }
      th,
      td {
        padding: 10px;
        text-align: center;
      }
      button {
        cursor: pointer;
      }
      .edit {
        background: #ffc107;
        border: none;
      }
      .delete {
        background: #dc3545;
        color: white;
        border: none;
      }
    </style>
  </head>
  <body>
    <h2>Student Management System</h2>

    <form id="studentForm">
      <input type="hidden" id="studentIndex" />
      <input type="text" id="name" placeholder="Student Name" required />
      <input type="number" id="age" placeholder="Age" required />
      <input type="text" id="course" placeholder="Course" required />
      <button type="submit">Save Student</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Course</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="studentTable"></tbody>
    </table>

    <script>
      let students = JSON.parse(localStorage.getItem("students")) || [];

      const form = document.getElementById("studentForm");
      const table = document.getElementById("studentTable");

      function displayStudents() {
        table.innerHTML = "";
        students.forEach((student, index) => {
          table.innerHTML += `
                <tr>
                    <td>${student.name}</td>
                    <td>${student.age}</td>
                    <td>${student.course}</td>
                    <td>
                        <button class="edit" onclick="editStudent(${index})">Edit</button>
                        <button class="delete" onclick="deleteStudent(${index})">Delete</button>
                    </td>
                </tr>
            `;
        });
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const name = document.getElementById("name").value;
        const age = document.getElementById("age").value;
        const course = document.getElementById("course").value;
        const index = document.getElementById("studentIndex").value;

        if (index === "") {
          // Add Student
          students.push({ name, age, course });
        } else {
          // Update Student
          students[index] = { name, age, course };
          document.getElementById("studentIndex").value = "";
        }

        localStorage.setItem("students", JSON.stringify(students));
        form.reset();
        displayStudents();
      });

      function editStudent(index) {
        document.getElementById("name").value = students[index].name;
        document.getElementById("age").value = students[index].age;
        document.getElementById("course").value = students[index].course;
        document.getElementById("studentIndex").value = index;
      }

      function deleteStudent(index) {
        students.splice(index, 1);
        localStorage.setItem("students", JSON.stringify(students));
        displayStudents();
      }

      displayStudents();
    </script>
  </body>
</html>
